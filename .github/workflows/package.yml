# Copied unchanged from Gogo1951/Common-Core/addon-files; CI fails if it drifts.
# The release logic lives in Common-Core/.github/workflows/package.yml.
# Tag push: build and upload to CurseForge and Wago.
# Run workflow (Actions tab): dry run, builds the zip and uploads nothing.
name: Package and release

on:
  push:
    tags:
      - "**"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    uses: Gogo1951/Common-Core/.github/workflows/package.yml@main
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
